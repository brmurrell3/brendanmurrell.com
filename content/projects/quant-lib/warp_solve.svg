<text x="448" y="46.0" fill="#444" font-size="10">lane 31</text>
<rect x="448" y="50" width="13" height="22" fill="#b45309" fill-opacity="0.55" stroke="#b45309"/>
<rect x="462" y="50" width="13" height="22" fill="#1f5fa8" fill-opacity="0.15" stroke="#1f5fa8"/>
<rect x="476" y="50" width="13" height="22" fill="#1f5fa8" fill-opacity="0.15" stroke="#1f5fa8"/>
<rect x="490" y="50" width="13" height="22" fill="#1f5fa8" fill-opacity="0.15" stroke="#1f5fa8"/>
<rect x="504" y="50" width="13" height="22" fill="#1f5fa8" fill-opacity="0.15" stroke="#1f5fa8"/>
<rect x="518" y="50" width="13" height="22" fill="#1f5fa8" fill-opacity="0.15" stroke="#1f5fa8"/>
<rect x="532" y="50" width="13" height="22" fill="#1f5fa8" fill-opacity="0.15" stroke="#1f5fa8"/>
<rect x="546" y="50" width="13" height="22" fill="#b45309" fill-opacity="0.55" stroke="#b45309"/>
<text x="408" y="66.0" fill="#666">...</text>
<text x="590" y="59.0" fill="#b45309" font-size="10">first and last node of a lane</text>
<text x="590" y="73.0" fill="#1f5fa8" font-size="10">interior nodes</text>
<text x="20" y="102.0" fill="#333">1. Explicit half of Crank-Nicolson. Each lane needs one value from each neighbouring lane: 2 shuffles.</text>
<text x="20" y="122.0" fill="#333">2. Each lane eliminates its K-2 interior unknowns in terms of its first and last node. No communication.</text>
<text x="20" y="142.0" fill="#333">3. The 64 first/last unknowns form a tridiagonal system, 2 rows per lane, solved by parallel cyclic reduction:</text>
<text x="44" y="162.0" fill="#222" font-size="11.5">level 1: row r eliminates rows r-1 and r+1</text>
<text x="330" y="162.0" fill="#666" font-size="11.5">own lane and the neighbouring lane</text>
<text x="44" y="181.0" fill="#222" font-size="11.5">level 2: row r eliminates rows r-2 and r+2</text>
<text x="330" y="181.0" fill="#666" font-size="11.5">1 lane away</text>
<text x="44" y="200.0" fill="#222" font-size="11.5">level 3: row r eliminates rows r-4 and r+4</text>
<text x="330" y="200.0" fill="#666" font-size="11.5">2 lanes away</text>
<text x="44" y="219.0" fill="#222" font-size="11.5">level 4: row r eliminates rows r-8 and r+8</text>
<text x="330" y="219.0" fill="#666" font-size="11.5">4 lanes away</text>
<text x="44" y="238.0" fill="#222" font-size="11.5">level 5: row r eliminates rows r-16 and r+16</text>
<text x="330" y="238.0" fill="#666" font-size="11.5">8 lanes away</text>
<text x="44" y="257.0" fill="#222" font-size="11.5">level 6: row r eliminates rows r-32 and r+32</text>
<text x="330" y="257.0" fill="#666" font-size="11.5">16 lanes away</text>
<text x="44" y="276.0" fill="#666" font-size="11">The multipliers depend only on the matrix, so they are computed once per factorization and kept in registers.</text>
<text x="20" y="300.0" fill="#333">4. Each lane back-fills its interior from its two solved boundary values.</text>
<text x="20" y="320.0" fill="#333">5. Early-exercise projection and multiplier update (Ikonen-Toivanen), pointwise in registers.</text>
<text x="20" y="344.0" fill="#444">The matrix changes only when the step size does (Rannacher start, dividend dates). Between those points a step</text>
<text x="20" y="362.0" fill="#444">touches registers, shuffles and broadcast reads of the elimination factors in shared memory. Nothing goes to DRAM.</text>
</svg>
