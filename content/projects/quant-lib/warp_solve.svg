<rect x="286" y="50" width="13" height="22" fill="#1f5fa8" fill-opacity="0.15" stroke="#1f5fa8"/>
<rect x="300" y="50" width="13" height="22" fill="#1f5fa8" fill-opacity="0.15" stroke="#1f5fa8"/>
<rect x="314" y="50" width="13" height="22" fill="#1f5fa8" fill-opacity="0.15" stroke="#1f5fa8"/>
<rect x="328" y="50" width="13" height="22" fill="#1f5fa8" fill-opacity="0.15" stroke="#1f5fa8"/>
<rect x="342" y="50" width="13" height="22" fill="#1f5fa8" fill-opacity="0.15" stroke="#1f5fa8"/>
