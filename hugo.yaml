baseURL: "https://brendanmurrell.com/"
languageCode: "en-us"
title: "Brendan Murrell"
theme: "PaperMod"

pagination:
  pagerSize: 10

params:
  defaultTheme: "auto"
  showReadingTime: false
  showShareButtons: false
  showBreadCrumbs: false
  showPostNavLinks: true
  showCodeCopyButtons: true
  description: "Software Engineer | Options Pricing & Volatility | GPU & Low-Latency Systems"

  homeInfoParams:
    Title: "Brendan Murrell"
    Content: >
      I build options pricing, volatility, and margin systems at Charles
      Schwab. On my own time I work on hard problems outside finance, most
      recently chip placement and ASIC design.

  socialIcons:
    - name: github
      url: "https://github.com/brmurrell3"
    - name: linkedin
      url: "https://www.linkedin.com/in/brendanamurrell/"

  profileMode:
    enabled: false

menu:
  main:
    - identifier: projects
      name: Projects
      url: /projects/
      weight: 20

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    style: monokai
    lineNos: false
